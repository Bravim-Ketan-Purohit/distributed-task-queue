global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "dtq-control"
    static_configs:
      - targets: ["host.docker.internal:7201"]

  - job_name: "dtq-workers"
    static_configs:
      - targets:
          - "host.docker.internal:7206"
          - "host.docker.internal:7207"
          - "host.docker.internal:7208"
          - "host.docker.internal:7209"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
