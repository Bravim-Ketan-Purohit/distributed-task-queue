name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check dtq/ tests/
      - name: Ruff format check
        run: ruff format --check dtq/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q --timeout=30

  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Exactly-once property tests
        run: pytest tests/property -q --timeout=120

  integration-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["7202:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        ports: ["7203:5432"]
        env:
          POSTGRES_DB: dtq
          POSTGRES_USER: dtq
          POSTGRES_PASSWORD: dtq_dev
        options: >-
          --health-cmd "pg_isready -U dtq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          DTQ_REDIS_URL: redis://localhost:7202/0
          DTQ_DATABASE_URL: postgresql+asyncpg://dtq:dtq_dev@localhost:7203/dtq
        run: pytest tests/integration -q -m integration --timeout=60

  chaos-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["7202:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        ports: ["7203:5432"]
        env:
          POSTGRES_DB: dtq
          POSTGRES_USER: dtq
          POSTGRES_PASSWORD: dtq_dev
        options: >-
          --health-cmd "pg_isready -U dtq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Chaos tests
        env:
          DTQ_REDIS_URL: redis://localhost:7202/0
          DTQ_DATABASE_URL: postgresql+asyncpg://dtq:dtq_dev@localhost:7203/dtq
        run: pytest tests/chaos -q -m chaos --timeout=60

  cpp-loadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libhiredis-dev pkg-config
      - name: Build loadgen
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --parallel $(nproc)
      - name: Verify binary
        run: ./bench/build/loadgen --help

  web-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm install
      - name: Type check
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
